name: Tracking tool tests

on:
  push:
    branches: [main]
    paths:
      - tools/**
      - .gitattributes
      - .github/workflows/tracking-tests.yml
      - internal/standards/tracking-sync-usage.md
  pull_request:
    paths:
      - tools/**
      - .gitattributes
      - .github/workflows/tracking-tests.yml
      - internal/standards/tracking-sync-usage.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run offline conflict, migration and recovery suite
        run: python -m unittest discover -s tools -p "test_*.py" -v
